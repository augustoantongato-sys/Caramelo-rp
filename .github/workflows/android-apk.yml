name: Validate Godot project and build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/references/**'

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Android SDK packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk unzip wget
          java -version
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          mkdir -p "$ANDROID_SDK_PATH/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-cmdline-tools.zip
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$ANDROID_SDK_PATH/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_PATH/cmdline-tools/latest"
          yes | "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_PATH" --licenses >/dev/null
          "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_PATH=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> "$GITHUB_ENV"

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android export environment
        run: |
          set -eu
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          test -d "$ANDROID_SDK_PATH/platform-tools"
          test -f "$ANDROID_SDK_PATH/platforms/android-34/android.jar"
          test -x "$ANDROID_SDK_PATH/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_PATH/build-tools/34.0.0/apksigner"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/android_sdk_path = "$ANDROID_SDK_PATH"
export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
EOF
          cp "$HOME/.android/debug.keystore" ./debug.keystore
          echo "Android SDK: $ANDROID_SDK_PATH"
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run headless gameplay smoke test
        run: godot --headless --path . --quit-after 120

      - name: Export, sign and verify Android APK
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/CarameloRP-unsigned.apk > /tmp/android-export.log 2>&1 || {
            cat /tmp/android-export.log
            exit 1
          }
          test -s build/CarameloRP-unsigned.apk
          "$ANDROID_SDK_PATH/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/CarameloRP.apk build/CarameloRP-unsigned.apk
          "$ANDROID_SDK_PATH/build-tools/34.0.0/apksigner" verify --verbose build/CarameloRP.apk
          file build/CarameloRP.apk
          ls -lh build/CarameloRP.apk
          rm build/CarameloRP-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caramelo-RP-Android
          path: build/CarameloRP.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Caramelo RP — versão Android
          body: APK de depuração do Caramelo RP.
          files: build/CarameloRP.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
